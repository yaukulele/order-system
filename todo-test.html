<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>待辦便利貼（測試版）</title>
<style>
:root{--bg:#f4f3ee;--sf:#fff;--sf2:#faf9f5;--bd:#ddd9cf;--tx:#1c1b18;--dm:#807b6f;--ht:#b0aa9c;--mo:#d6336c;--grn:#2d7a4f;--grn-bg:#eef7f1;--amb:#b8860b;--amb-bg:#fef9ec;--blu:#2563eb;--blu-bg:#e8eef9;--red:#c0392b;--red-bg:#fef0ee;--pur:#7e22ce;--pur-bg:#f3e8ff;--mono:'Menlo','Consolas','Courier New',monospace;--sans:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Segoe UI',sans-serif}
[data-theme="dark"]{--bg:#0d1117;--sf:#161b22;--sf2:#0d1117;--bd:#30363d;--tx:#e6edf3;--dm:#8b949e;--ht:#6e7681;--mo:#ff6b9a;--grn:#3fb950;--grn-bg:#0e2914;--amb:#d29922;--amb-bg:#332b14;--blu:#60a5fa;--blu-bg:#12233d;--red:#ff8a7a;--red-bg:#3a1a16;--pur:#c084fc;--pur-bg:#2a1839}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:40px}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
button{font-family:var(--sans);cursor:pointer}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:12px;font-weight:600;transition:border-color .15s}
.btn:hover{border-color:var(--ht)}
.btn-g{background:var(--grn);color:#fff;border-color:var(--grn)}.btn-g:hover{opacity:.88;border-color:var(--grn)}
.btn-b{background:var(--blu);color:#fff;border-color:var(--blu)}.btn-b:hover{opacity:.88;border-color:var(--blu)}
.btn-r{background:var(--red);color:#fff;border-color:var(--red)}.btn-r:hover{opacity:.88;border-color:var(--red)}
.btn-sm{padding:4px 9px;font-size:11px;border-radius:6px}
input,select,textarea{font-family:var(--sans);font-size:13px;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--grn)}
textarea{resize:vertical;min-height:70px;line-height:1.7}
label{display:block;font-size:11px;font-weight:700;color:var(--dm);margin-bottom:5px;letter-spacing:.02em}

.hdr{position:sticky;top:0;z-index:60;background:var(--sf);border-bottom:1px solid var(--bd);padding:11px 0}
.hdr-in{max-width:1400px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:16px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.tag-test{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--amb-bg);color:var(--amb);border:1px solid var(--amb);letter-spacing:.04em}
.hdr-sp{flex:1}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--tx)}
.icon-btn:hover{border-color:var(--ht)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bell-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--dm);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.bell-badge.urgent{background:var(--red)}
.bell-live{animation:bellRing 1.6s ease-in-out infinite}
#notif-b .nx{display:none}
#notif-b.off{color:var(--ht)}
#notif-b.off .nw{display:none}
#notif-b.off .nx{display:block}
#notif-b.on{color:var(--grn);border-color:var(--grn)}
@keyframes bellRing{0%,72%,100%{transform:rotate(0)}78%{transform:rotate(11deg)}84%{transform:rotate(-9deg)}90%{transform:rotate(5deg)}}
.who{font-size:11px;color:var(--dm);font-weight:700;display:flex;align-items:center;gap:6px}
.who .role{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--sf2);border:1px solid var(--bd);letter-spacing:.03em}
.who .role.adm{background:var(--pur-bg);color:var(--pur);border-color:var(--pur)}
.conn{font-size:10px;font-weight:700;color:var(--dm);display:flex;align-items:center;gap:5px}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--ht);display:block}
.conn.on i{background:var(--grn)}
.conn.off i{background:var(--red)}

.bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:14px 0 4px}
.chip{padding:6px 13px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);font-size:12px;font-weight:700;color:var(--dm)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.72;margin-left:5px}
.bar-sp{flex:1}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;align-items:start}
.col{background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:12px;min-height:130px}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding:0 2px}
.col-dot{width:9px;height:9px;border-radius:50%;flex:none}
.col-h b{font-size:13px;font-weight:800;letter-spacing:.01em}
.col-h .n{font-family:var(--mono);font-size:11px;color:var(--dm);font-weight:700}
.col-empty{text-align:center;padding:26px 10px;color:var(--ht);font-size:12px}

.note{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:10px;padding:11px 12px;margin-bottom:9px;position:relative;transition:box-shadow .15s}
.note:hover{box-shadow:0 4px 14px rgba(0,0,0,.07)}
.note.mine{border-left-color:var(--blu);background:linear-gradient(90deg,var(--blu-bg) 0%,var(--sf) 22%)}
.note.p5{border-left-color:var(--red)}
.note.p4{border-left-color:var(--amb)}
.note.overdue{border-color:var(--red)}
.note.done{opacity:.5}
.note.done .n-title{text-decoration:line-through;color:var(--dm)}
.n-top{display:flex;align-items:flex-start;gap:9px}
.n-chk{width:19px;height:19px;flex:none;border-radius:6px;border:2px solid var(--bd);background:var(--sf);margin-top:1px;display:flex;align-items:center;justify-content:center;padding:0}
.n-chk:hover{border-color:var(--grn)}
.n-chk.on{background:var(--grn);border-color:var(--grn)}
.n-chk svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.n-body{flex:1;min-width:0}
.n-title{font-size:13.5px;font-weight:700;line-height:1.45;word-break:break-word}
.n-detail{font-size:12px;color:var(--dm);margin-top:4px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.n-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:10px;font-weight:700;padding:2.5px 7px;border-radius:5px;border:1px solid var(--bd);color:var(--dm);background:var(--sf2);white-space:nowrap}
.pill.due{background:var(--amb-bg);color:var(--amb);border-color:var(--amb)}
.pill.due.od{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.pill.asg{background:var(--blu-bg);color:var(--blu);border-color:var(--blu)}
.pill.mute{background:var(--sf2);color:var(--ht)}
.stars{font-size:11px;letter-spacing:1px;font-weight:800;white-space:nowrap;font-family:var(--mono)}
.n-act{display:flex;gap:5px;margin-left:auto}
.n-ico{width:24px;height:24px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--ht);display:flex;align-items:center;justify-content:center;padding:0}
.n-ico:hover{border-color:var(--bd);color:var(--tx)}
.n-ico svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.n-foot{font-size:10px;color:var(--ht);margin-top:7px;font-family:var(--mono)}

.done-sec{margin-top:20px}
.done-h{display:flex;align-items:center;gap:8px;padding:9px 2px;font-size:12px;font-weight:700;color:var(--dm);cursor:pointer;user-select:none}
.done-h svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .18s}
.done-h.open svg{transform:rotate(90deg)}
.done-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px);animation:fadeIn .18s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.md{background:var(--sf);border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.22);animation:mdIn .24s cubic-bezier(.2,.9,.3,1.1)}
@keyframes mdIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.md h3{font-size:15px;font-weight:800;margin-bottom:4px}
.md .sub{font-size:12px;color:var(--dm);margin-bottom:16px}
.fld{margin-bottom:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.md-ft{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;align-items:center}
.md-ft .left{margin-right:auto}
.star-pick{display:flex;gap:3px}
.star-pick button{width:31px;height:31px;border:1px solid var(--bd);background:var(--sf);border-radius:7px;font-size:14px;line-height:1;color:var(--ht);padding:0}
.star-pick button.on{background:var(--amb-bg);border-color:var(--amb);color:var(--amb)}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px 4px;border:0;background:var(--sf);font-size:12px;font-weight:700;color:var(--dm);border-right:1px solid var(--bd);white-space:nowrap}
.seg.sm button{font-size:11px;padding:8px 2px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--tx);color:var(--bg)}
.note-admin{border:1px dashed var(--pur);background:var(--pur-bg);border-radius:10px;padding:11px;margin-top:4px}
.note-admin .tt{font-size:10px;font-weight:800;color:var(--pur);letter-spacing:.04em;margin-bottom:8px}
.warn{font-size:11.5px;color:var(--amb);background:var(--amb-bg);border:1px solid var(--amb);border-radius:8px;padding:9px 11px;line-height:1.6}

.rm-list{max-height:46vh;overflow-y:auto;margin:4px 0 6px;border:1px solid var(--bd);border-radius:11px}
.rm-item{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-bottom:1px solid var(--bd)}
.rm-item:last-child{border-bottom:0}
.rm-item.od{background:var(--red-bg)}
.rm-b{flex:1;min-width:0}
.rm-t{font-size:13px;font-weight:700;line-height:1.45}
.rm-m{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:11px;font-size:13px;font-weight:600;z-index:400;display:flex;align-items:center;gap:12px;box-shadow:0 10px 34px rgba(0,0,0,.28);max-width:92vw;animation:tIn .22s ease-out}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%)}}

.lg-chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.lg-chips button{padding:11px 8px;border:1px solid var(--bd);border-radius:9px;background:var(--sf);font-size:13px;font-weight:700;color:var(--tx)}
.lg-chips button.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.lg-err{color:var(--red);font-size:12px;min-height:18px;margin-top:7px}

@media(max-width:860px){
  .board,.done-grid{grid-template-columns:1fr}
  .hdr h1{font-size:14px}
  .hdr-in{gap:7px}
  .conn{display:none}
  .md{max-width:100%;border-radius:16px 16px 0 0;max-height:92dvh;align-self:flex-end}
  .ov{align-items:flex-end;padding:0}
  .row2{grid-template-columns:1fr}
  .btn{min-height:40px}
  .col{padding:10px}
}

/* ===== 個人目標 ===== */
.vsw{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--sf)}
.vsw button{padding:6px 15px;border:0;background:transparent;font-size:12px;font-weight:700;color:var(--dm)}
.vsw button.on{background:var(--tx);color:var(--bg)}
.g-wrap{padding-top:14px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
.g-card{background:var(--sf);border:1px solid var(--bd);border-radius:13px;padding:14px 15px}
.g-card.hit{border-color:var(--grn)}
.g-card.expired{border-color:var(--red)}
.g-top{display:flex;align-items:flex-start;gap:9px}
.g-owner{font-size:10px;font-weight:800;padding:2.5px 8px;border-radius:5px;background:var(--pur-bg);color:var(--pur);border:1px solid var(--pur);white-space:nowrap}
.g-title{font-size:13.5px;font-weight:800;line-height:1.45;flex:1;word-break:break-word}
.g-num{display:flex;align-items:baseline;gap:4px;margin:11px 0 5px;font-family:var(--mono)}
.g-num b{font-size:29px;font-weight:800;line-height:1;letter-spacing:-.02em}
.g-num span{font-size:12px;color:var(--dm);font-weight:700}
.g-bar{height:7px;border-radius:4px;background:var(--sf2);border:1px solid var(--bd);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--blu);transition:width .3s}
.g-card.hit .g-bar i{background:var(--grn)}
.g-card.expired .g-bar i{background:var(--red)}
.g-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
.g-ft{display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid var(--bd)}
.g-plus{padding:7px 15px;border-radius:8px;border:1px solid var(--grn);background:var(--grn);color:#fff;font-size:12px;font-weight:800}
.g-plus:disabled{opacity:.4}
.g-hist{font-size:10px;color:var(--ht);font-family:var(--mono);margin-left:auto;text-align:right;line-height:1.5}
.g-log{margin-top:9px;border-top:1px dashed var(--bd);padding-top:8px;font-size:11px;color:var(--dm);font-family:var(--mono);line-height:1.75}
.g-empty{text-align:center;padding:40px 16px;color:var(--ht);font-size:12.5px;line-height:1.9}
.vtabs{display:flex;gap:6px;padding:12px 0 0}
.vtab{padding:8px 16px;border-radius:9px 9px 0 0;border:1px solid var(--bd);border-bottom:0;background:var(--sf2);font-size:12.5px;font-weight:700;color:var(--dm)}
.vtab.on{background:var(--sf);color:var(--tx);box-shadow:0 -2px 0 var(--grn) inset}
.vtab .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:5px}
@media(max-width:860px){.vtab{flex:1;text-align:center;padding:9px 6px}.g-grid{grid-template-columns:1fr}}

/* ===== 便利貼留言：記進度、記卡在哪，不用勾掉也能交代事情做到哪 ===== */
.n-msg{margin-top:6px;font-size:11.5px;line-height:1.6;color:var(--dm);background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;word-break:break-word}
.n-msg b{color:var(--tx);font-weight:800}
.n-msg .more{color:var(--blu);font-weight:700;margin-left:6px;white-space:nowrap}
.n-ico.has{color:var(--blu);border-color:var(--blu)}
.n-cnt{font-family:var(--mono);font-size:9.5px;font-weight:800;margin-left:2px}
.tk-list{max-height:44vh;overflow-y:auto;border:1px solid var(--bd);border-radius:11px;margin-bottom:12px}
.tk-i{padding:9px 12px;border-bottom:1px solid var(--bd);font-size:12.5px;line-height:1.65}
.tk-i:last-child{border-bottom:0}
.tk-i .h{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
.tk-i .h b{font-size:11.5px;font-weight:800}
.tk-i .h .t{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ht)}
.tk-i .h .del{border:0;background:transparent;color:var(--ht);font-size:12px;padding:0 2px;line-height:1}
.tk-i .h .del:hover{color:var(--red)}
.tk-i .x{color:var(--dm);white-space:pre-wrap;word-break:break-word}
.tk-empty{padding:26px 12px;text-align:center;color:var(--ht);font-size:12px}

/* ===== 我的紀錄 ===== */
.rc-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-top:14px}
.rc-n{background:var(--sf);border:1px solid var(--bd);border-radius:13px;padding:15px 16px}
.rc-n .k{font-size:11px;font-weight:700;color:var(--dm)}
.rc-n .v{font-size:31px;font-weight:900;font-family:var(--mono);line-height:1.15;margin-top:4px;letter-spacing:-.02em}
.rc-n .s{font-size:10.5px;color:var(--ht);margin-top:2px;font-family:var(--mono)}
.rc-list{margin-top:16px;background:var(--sf);border:1px solid var(--bd);border-radius:13px;overflow:hidden}
.rc-h{padding:11px 15px;font-size:12px;font-weight:800;border-bottom:1px solid var(--bd);background:var(--sf2)}
.rc-r{display:flex;gap:9px;padding:9px 15px;border-bottom:1px solid var(--bd);font-size:12.5px;align-items:baseline}
.rc-r:last-child{border-bottom:0}
.rc-r .tag{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:4px;flex:none;white-space:nowrap}
.rc-r .tag.n{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn)}
.rc-r .tag.g{background:var(--blu-bg);color:var(--blu);border:1px solid var(--blu)}
.rc-r .x{flex:1;min-width:0;word-break:break-word}
.rc-r .t{margin-left:auto;flex:none;font-family:var(--mono);font-size:10px;color:var(--ht)}
.rc-r .by{font-size:10px;color:var(--ht);font-family:var(--mono);flex:none}

.n-msg{font-size:11.5px;color:var(--dm);background:var(--sf2);border-left:2px solid var(--bd);border-radius:0 6px 6px 0;padding:5px 8px;margin-top:6px;line-height:1.55;word-break:break-word}
.n-msg b{color:var(--tx)}
.n-msg .more{color:var(--ht);margin-left:6px}
.n-ico.has{color:var(--blu)}
.n-cnt{font-family:var(--mono);font-size:9px;font-weight:800;margin-left:1px}
.th-list{max-height:44vh;overflow-y:auto;border:1px solid var(--bd);border-radius:10px;background:var(--sf2);padding:4px}
.th-i{position:relative;padding:8px 26px 8px 10px;border-bottom:1px solid var(--bd)}
.th-i:last-child{border-bottom:0}
.th-h{display:flex;gap:8px;align-items:baseline;font-size:10.5px;color:var(--dm);font-family:var(--mono)}
.th-h b{font-family:var(--sans);font-size:12px;color:var(--tx)}
.th-t{font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.th-x{position:absolute;top:6px;right:6px;width:20px;height:20px;border:0;background:transparent;color:var(--ht);font-size:15px;line-height:1;border-radius:5px}
.th-x:hover{background:var(--red-bg);color:var(--red)}
</style>
</head>
<body>

<div class="ov hidden" id="lg-ov" style="z-index:500">
  <div class="md" style="max-width:390px">
    <h3>待辦便利貼</h3>
    <div class="sub">測試版 — 選名字後輸入密碼（同撈單系統）</div>
    <div class="fld"><label>選擇使用者</label><div class="lg-chips" id="lg-chips"></div></div>
    <div class="fld"><label>密碼</label><input id="lg-pass" type="password" autocomplete="current-password"></div>
    <div class="lg-err" id="lg-err"></div>
    <div class="md-ft"><button class="btn btn-g" id="lg-go">登入</button></div>
  </div>
</div>

<div class="hdr">
  <div class="hdr-in">
    <h1>待辦便利貼<span class="tag-test">測試版</span></h1>
    <span class="conn" id="conn"><i></i><span>連線中</span></span>
    <span class="hdr-sp"></span>
    <button class="icon-btn" id="bell" title="待辦提醒">

<script>
/* =========================================================================

firebase.initializeApp({

const CATS = [
  {k:'課務', c:'var(--blu)'},

  {k:'線上', c:'var(--mo)'}
];
const SNOOZE_MIN = 10, SNOOZE_MAX = 60;          // 一般使用者只能在這個範圍內延後

/* ---------- state ---------- */
let me = null, myRole = '';

let fCat = 'all', fMine = false;
let goals = [];                                   // 個人目標 [{id, owner, title, target, unit, start, end, log:{}}]

let gWho = '';                                    // 目標頁的人員篩選（管理員限定，'' = 全部人）

let editingId = null, draftStars = 3;
let reminderOpen = false;

/* ---------- utils ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const todayStr = () => {const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const isAdmin = () => myRole === 'admin';

function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts), n = new Date();
  const sameDay = d.toDateString() === n.toDateString();
  const hm = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return sameDay ? hm : (d.getMonth()+1)+'/'+d.getDate()+' '+hm;
}
function dueInfo(due){
  if(!due) return {txt:'', overdue:false};
  const t = todayStr();
  const diff = Math.round((new Date(due+'T00:00:00') - new Date(t+'T00:00:00'))/86400000);
  if(diff < 0)  return {txt:'逾期 '+Math.abs(diff)+' 天', overdue:true};
  if(diff === 0) return {txt:'今天到期', overdue:false, today:true};
  return {txt: diff<=7 ? diff+' 天後' : due.slice(5), overdue:false};
}
function starStr(n){n=Math.max(1,Math.min(5,n||3));return '★'.repeat(n)+'☆'.repeat(5-n)}
function starColor(n){return n>=5?'var(--red)':n>=4?'var(--amb)':'var(--dm)'}

let _toastEl=null,_toastT=null;
function toast(msg, ms){
  if(_toastT)clearTimeout(_toastT);
  if(_toastEl)_toastEl.remove();
  const el=document.createElement('div');el.className='toast';
  el.innerHTML='<span>'+esc(msg)+'</span>';
  document.body.appendChild(el);_toastEl=el;
  _toastT=setTimeout(()=>{el.remove();if(_toastEl===el)_toastEl=null}, ms||3000);
}
function logAction(action, detail){
  if(!me) return;
  authReady.then(()=>{
    try{ db.ref(PATHS.log).push({ts:new Date().toISOString(), user:me, action:'[待辦]'+action, detail:detail||''}) }catch(e){}
  });
}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- 提醒 vs 看得到，是兩件事 ----------
   看：全部人都看得到全部事項（店務要透明，才知道誰新增、誰完成）。
   提醒：只吵「指派給我的」＋「沒指派給任何人的」。
   管理員不特別處理 — 否則每個人的個人任務都會去吵管理員，一天下來吵到沒人想理。
   管理員要被某張提醒，把它指派給自己就好。 */
function remindsMe(t){
  return !t.assignee || t.assignee === me;
}
function visibleToMe(t){ return true }

/* =========================================================================
   登入
   ========================================================================= */
function showLogin(){
  $('lg-ov').classList.remove('hidden');
  const box = $('lg-chips');
  const names = Object.keys(users);
  box.innerHTML = names.map(n=>'<button data-u="'+esc(n)+'">'+esc(n)+'</button>').join('');
  let pick = null;
  box.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      pick = b.dataset.u;
      box.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
      $('lg-pass').focus();
    };
  });
  const go = ()=>{
    const p = $('lg-pass').value;
    if(!pick){ $('lg-err').textContent = '請先選一個名字'; return }
    const u = users[pick];
    if(!u || u.password !== p){ $('lg-err').textContent = '密碼不對'; return }
    me = pick; myRole = u.role || 'user';
    lsSet('todoTestUser', {u:me, r:myRole});
    $('lg-ov').classList.add('hidden');
    onReady();
  };
  $('lg-go').onclick = go;
  $('lg-pass').onkeypress = e => { if(e.key==='Enter') go() };
}

async function boot(){
  // theme
  const th = lsGet('todoTestTheme','light');
  document.documentElement.setAttribute('data-theme', th);
  $('theme-b').onclick = ()=>{
    const cur = document.documentElement.getAttribute('data-theme');
    const nx = cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme', nx);
    lsSet('todoTestTheme', nx);
  };

  db.ref('.info/connected').on('value', s=>{
    const el = $('conn');
    el.className = 'conn ' + (s.val()?'on':'off');
    el.querySelector('span').textContent = s.val()?'已連線':'離線';
  });

  db.ref('users').on('value', s=>{
    const v = s.val();
    if(!v) return;
    users = v;
    lsSet('todoTestUsers', users);   // 離線／斷線時還登得進來
    // 角色被改（升級/降級）即時生效，不用等重整
    if(me && users[me]){
      const r = users[me].role || 'user';
      if(r !== myRole){ myRole = r; $('set-b').classList.toggle('hidden', !isAdmin()); render() }
    }
  });

  // db.ref().get() 在離線時「不會 reject，會一直吊著」— 直接 await 會讓整頁卡住，
  // 連登入框都出不來。所以給它一個時限，逾時就用 localStorage 的快取名單先撐著。
  users = lsGet('todoTestUsers', {}) || {};
  try{
    const snap = await Promise.race([
      db.ref('users').get(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('users get timeout')), 4000))
    ]);
    const v = snap.val();
    if(v){ users = v; lsSet('todoTestUsers', users) }
  }catch(e){
    console.warn('users 讀取逾時／失敗，改用本機快取', e && e.message);
  }
  if(!Object.keys(users).length) users = {'Allie':{password:'Allie',role:'admin'}};

  const saved = lsGet('todoTestUser', null);
  if(saved && users[saved.u]){ me = saved.u; myRole = users[saved.u].role || 'user'; onReady() }
  else showLogin();
}

function onReady(){
  sessionStart = Date.now();
  lastRemind = lsGet('todoTestLastRemind_'+me, {});
  $('who').innerHTML = '<span class="nm">'+esc(me)+'</span><span class="role'+(isAdmin()?' adm':'')+'">'+(isAdmin()?'管理員':'一般')+'</span>';
  $('set-b').classList.toggle('hidden', !isAdmin());

  db.ref(PATHS.settings).on('value', s=>{
    const v = s.val() || {};
    settings = {enabled: v.enabled !== false, everyMin: v.everyMin || DEFAULT_EVERY};
    render();
  });
  db.ref(PATHS.snooze+'/'+me).on('value', s=>{ snoozeUntil = (s.val()||{}).until || 0 });
  db.ref(PATHS.todos).on('value', s=>{
    const v = s.val() || {};
    todos = Object.keys(v).map(k=>Object.assign({id:k}, v[k]));
    render();
    // 有人正開著某張的留言視窗 → 別人剛留的要當場出現，不用關掉重開
    Object.keys(_threadPainters).forEach(k=>{ try{ _threadPainters[k]() }catch(_){} });
  });
  db.ref(PATHS.goals).on('value', s=>{
    const v = s.val() || {};
    goals = Object.keys(v).map(k=>Object.assign({id:k}, v[k]));
    render();
  });

  $('vtabs').querySelectorAll('.vtab').forEach(b=>b.onclick=()=>setView(b.dataset.v));
  $('notif-b').onclick = toggleNotif;
  updateNotifBtn();
  // 新增鈕看目前在哪一頁：便利貼頁開便利貼、目標頁開目標
  $('add-b').onclick = ()=> view==='goals' ? openGoalEdit(null) : openEdit(null);
  $('bell').onclick  = ()=>openReminder(true);
  $('set-b').onclick = openSettings;
  $('done-h').onclick = ()=>{
    const g = $('done-grid'), h = $('done-h');
    g.classList.toggle('hidden'); h.classList.toggle('open');
    lsSet('todoTestDoneOpen', !g.classList.contains('hidden'));
  };
  if(lsGet('todoTestDoneOpen', false)){ $('done-grid').classList.remove('hidden'); $('done-h').classList.add('open') }
  setView(lsGet('todoTestView', 'notes') === 'goals' ? 'goals' : 'notes');

  setInterval(tick, 20000);
  setTimeout(tick, 2500);
}

/* =========================================================================
   render
   ========================================================================= */
function sortNotes(a,b){
  const da = dueInfo(a.due), dbb = dueInfo(b.due);
  if(da.overdue !== dbb.overdue) return da.overdue ? -1 : 1;   // 逾期最前
  if((b.priority||3) !== (a.priority||3)) return (b.priority||3)-(a.priority||3);
  const ad = a.due || '9999-99-99', bd = b.due || '9999-99-99';
  if(ad !== bd) return ad < bd ? -1 : 1;
  return (b.createdAt||0)-(a.createdAt||0);
}

function render(){
  const open = todos.filter(t=>!t.done && visibleToMe(t));
  const doneList = todos.filter(t=>t.done && visibleToMe(t)).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));

  // filter bar
  const mineN = open.filter(t=>t.assignee===me).length;
  let bar = '<button class="chip'+(fCat==='all'?' on':'')+'" data-c="all">全部<span class="n">'+open.length+'</span></button>';
  CATS.forEach(c=>{
    const n = open.filter(t=>t.cat===c.k).length;
    bar += '<button class="chip'+(fCat===c.k?' on':'')+'" data-c="'+esc(c.k)+'">'+esc(c.k)+'<span class="n">'+n+'</span></button>';
  });
  bar += '<span class="bar-sp"></span>';
  bar += '<button class="chip'+(fMine?' on':'')+'" id="f-mine">只看指派給我的<span class="n">'+mineN+'</span></button>';
  $('bar').innerHTML = bar;
  $('bar').querySelectorAll('.chip[data-c]').forEach(b=>b.onclick=()=>{fCat=b.dataset.c;render()});
  $('f-mine').onclick = ()=>{fMine=!fMine;render()};

  // board
  const shown = CATS.filter(c=>fCat==='all'||fCat===c.k);
  $('board').style.gridTemplateColumns = window.innerWidth<=860 ? '1fr' : 'repeat('+Math.max(1,shown.length)+',1fr)';
  $('board').innerHTML = shown.map(c=>{
    let list = open.filter(t=>t.cat===c.k);
    if(fMine) list = list.filter(t=>t.assignee===me);
    list.sort(sortNotes);
    return '<div class="col">'
      + '<div class="col-h"><span class="col-dot" style="background:'+c.c+'"></span><b>'+esc(c.k)+'</b><span class="n">'+list.length+'</span></div>'
      + (list.length ? list.map(noteHTML).join('') : '<div class="col-empty">目前沒有事項</div>')
      + '</div>';
  }).join('');

  // done — 只留今天完成的，隔天自動收起來
  const t0 = new Date(); t0.setHours(0,0,0,0);
  const todayDone = doneList.filter(t=>(t.doneAt||0) >= t0.getTime());
  const older = doneList.length - todayDone.length;
  $('done-h-t').textContent = '今日已完成 ' + todayDone.length + (older>0 ? '（更早的 '+older+' 筆已收起）' : '');
  $('done-grid').innerHTML = todayDone.length
    ? '<div class="col" style="grid-column:1/-1">'+todayDone.map(noteHTML).join('')+'</div>'
    : '<div class="col" style="grid-column:1/-1"><div class="col-empty">今天還沒有完成的事項</div></div>';

  bindNotes();
  updateBell(open);

  // 分頁計數 + 個人目標頁
  $('vt-notes').textContent = open.length;
  const myGoals = goals.filter(goalVisible);
  $('vt-goals').textContent = myGoals.length;
  renderGoals();
  renderRec();
}

function noteHTML(t){
  const d = dueInfo(t.due);
  const mine = t.assignee === me;
  const cls = ['note'];
  if(t.done) cls.push('done');
  else{
    if(mine) cls.push('mine');
    if((t.priority||3) >= 5) cls.push('p5'); else if((t.priority||3) === 4) cls.push('p4');
    if(d.overdue) cls.push('overdue');
  }
  // 杰哥 2026-08-20 選 A：編輯跟刪除同一套規則 —— 只有建立者和管理員能動。
  // 其他人要回報狀況就按底下的「進度」留言，不要直接改掉別人寫的內容。
  const canEdit = isAdmin() || t.createdBy === me;
  const canDelete = canEdit;
  let meta = '<span class="stars" style="color:'+starColor(t.priority)+'">'+starStr(t.priority)+'</span>';
  if(t.due) meta += '<span class="pill due'+(d.overdue?' od':'')+'">'+esc(d.txt)+'</span>';
  if(t.assignee) meta += '<span class="pill asg">指派 '+esc(t.assignee)+(mine?'（你）':'')+'</span>';
  if(t.noRemind) meta += '<span class="pill mute">不提醒</span>';
  else if(t.remindEvery) meta += '<span class="pill mute">每 '+t.remindEvery+' 分</span>';

  const nList = noteMsgs(t), nN = nList.length;
  const lastMsg = nN ? nList[0] : null;
  const foot = t.done
    ? '完成：' + esc(t.doneBy||'?') + ' · ' + fmtTime(t.doneAt) + '　新增：' + esc(t.createdBy||'?')
    : '新增：' + esc(t.createdBy||'?') + ' · ' + fmtTime(t.createdAt);

  return '<div class="'+cls.join(' ')+'" data-id="'+esc(t.id)+'">'
    + '<div class="n-top">'
    +   '<button class="n-chk'+(t.done?' on':'')+'" data-act="toggle" title="'+(t.done?'取消完成':'標記完成')+'">'
    +     (t.done?'<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>':'')
    +   '</button>'
    +   '<div class="n-body">'
    +     '<div class="n-title">'+esc(t.title||'(無標題)')+'</div>'
    +     (t.detail ? '<div class="n-detail">'+esc(t.detail)+'</div>' : '')
    +     (lastMsg ? '<div class="n-msg"><b>'+esc(lastMsg.by||'?')+'</b>：'+esc(lastMsg.text||'')
    +                 (nN>1?'<span class="more">還有 '+(nN-1)+' 則</span>':'')+'</div>' : '')
    +     '<div class="n-meta">'+meta
    +       '<span class="n-act">'
    +         '<button class="n-ico'+(nN?' has':'')+'" data-act="talk" title="進度／狀況留言">'
    +           '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.6-4.6A8.4 8.4 0 0 1 3.6 11 8.4 8.4 0 0 1 12 2.6a8.4 8.4 0 0 1 9 8.9z"/></svg>'
    +           (nN?'<span class="n-cnt">'+nN+'</span>':'')
    +         '</button>'
    +         (canEdit ? '<button class="n-ico" data-act="edit" title="編輯"><svg viewBox="0 0 24 24"><path d="M11 4H4v16h16v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>' : '')
    +         (canDelete ? '<button class="n-ico" data-act="del" title="刪除"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>' : '')
    +       '</span>'
    +     '</div>'
    +     '<div class="n-foot">'+foot+'</div>'
    +   '</div>'
    + '</div></div>';
}

function bindNotes(){
  document.querySelectorAll('.note [data-act]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const id = b.closest('.note').dataset.id;
      const act = b.dataset.act;
      if(act==='toggle') toggleDone(id);
      else if(act==='edit') openEdit(id);
      else if(act==='talk') openThread(id);
      else if(act==='del') delNote(id);
    };
  });
}

function updateBell(open){
  const mineOrAll = open.filter(remindsMe);
  const n = mineOrAll.length;
  const urgent = mineOrAll.filter(t=>dueInfo(t.due).overdue || (t.priority||3)>=5).length;
  const badge = $('bell-n');
  badge.textContent = n;
  badge.classList.toggle('hidden', n===0);
  badge.classList.toggle('urgent', urgent>0);
  $('bell').classList.toggle('bell-live', urgent>0 && settings.enabled);
  $('bell').title = n ? (n+' 件未完成' + (urgent?'，其中 '+urgent+' 件緊急':'')) : '沒有未完成事項';
}

async function saveNote(ov){
  await authReady;
  const title = ov.querySelector('#e-title').value.trim();
  if(!title){ toast('事項不能空白'); return }
  const cat = ov.querySelector('#e-cat button.on')?.dataset.k || '店務';
  const detail = ov.querySelector('#e-detail').value.trim();
  const due = ov.querySelector('#e-due').value || '';
  const assignee = ov.querySelector('#e-asg').value || '';
  // 提醒規則只有管理員能改。一般人編輯內容時要原封不動帶回去，
  // 否則管理員設的「不提醒 / 每 10 分」會被一次無關的文字修改洗掉。
  let remindEvery = null, noRemind = false;
  const remSel = ov.querySelector('#e-rem button.on');
  if(isAdmin() && remSel){
    const v = remSel.dataset.v;
    if(v === 'off') noRemind = true;
    else if(v) remindEvery = parseInt(v);
  }else if(editingId){
    const prev0 = todos.find(t=>t.id===editingId);
    if(prev0){ remindEvery = prev0.remindEvery || null; noRemind = !!prev0.noRemind }
  }
  const payload = {title, detail, cat, priority:draftStars, due, assignee, remindEvery, noRemind};

  try{
    if(editingId){
      const prev = todos.find(t=>t.id===editingId) || {};
      // 只更新這幾個欄位 — 不整包覆寫，避免蓋掉別台剛改的 done/doneBy
      await db.ref(PATHS.todos+'/'+editingId).update(Object.assign({}, payload, {
        editedBy: me, editedAt: firebase.database.ServerValue.TIMESTAMP
      }));
      logAction('編輯', title);
      toast('已儲存');
      if(prev.assignee !== assignee && assignee) toast('已指派給 '+assignee);
    }else{
      await db.ref(PATHS.todos).push(Object.assign({}, payload, {
        done:false, createdBy:me, createdAt: firebase.database.ServerValue.TIMESTAMP
      }));
      logAction('新增', title + (assignee ? '（指派 '+assignee+'）' : ''));
      toast(assignee ? ('已新增並指派給 '+assignee) : '已新增');
    }
    ov.remove();
  }catch(e){ toast('存檔失敗：'+e.message) }
}

async function toggleDone(id){
  await authReady;
  const t = todos.find(x=>x.id===id);
  if(!t) return;
  const now = !t.done;
  try{
    // update 而非 set — 同一張便利貼別人正在編輯內容時不會被互相蓋掉
    await db.ref(PATHS.todos+'/'+id).update(now
      ? {done:true,  doneBy:me, doneAt: firebase.database.ServerValue.TIMESTAMP}
      : {done:false, doneBy:null, doneAt:null});
    logAction(now?'完成':'取消完成', t.title||'');
    if(now){
      delete lastRemind[id];
      lsSet('todoTestLastRemind_'+me, lastRemind);
      toast('完成：'+(t.title||''));
    }
  }catch(e){ toast('更新失敗：'+e.message) }
}

async function delNote(id){
  await authReady;
  const t = todos.find(x=>x.id===id);
  if(!t) return;
  if(!(isAdmin() || t.createdBy===me)){ toast('只能刪自己新增的'); return }
  if(!confirm('確定刪除「'+(t.title||'')+'」？刪掉就找不回來了。')) return;
  try{
    await db.ref(PATHS.todos+'/'+id).remove();
    logAction('刪除', t.title||'');
    toast('已刪除');
  }catch(e){ toast('刪除失敗：'+e.message) }
}

/* =========================================================================
   提醒
   ========================================================================= */
function dueForReminder(){
  if(!settings.enabled) return [];
  if(Date.now() < snoozeUntil) return [];
  const now = Date.now();
  return todos.filter(t=>{
    if(t.done || t.noRemind) return false;
    if(!remindsMe(t)) return false;
    const every = (t.remindEvery || settings.everyMin) * 60000;
    // 起算點要取「開分頁」跟「這張被建立」兩者中比較晚的那個。
    // 只用 sessionStart 的話：分頁開了兩小時後才新增一張，它的起算點是兩小時前，
    // 下一次 tick（20 秒內）就會立刻跳出來提醒你剛剛才打完的字。
    const last = lastRemind[t.id] || Math.max(sessionStart, t.createdAt || 0);
    return now - last >= every;
  }).sort(sortNotes);
}

/* 分頁在前景 → 直接跳視窗；在背景 → 發桌面通知（有授權的話）。
   沒授權就什麼都不做，等切回這個分頁再跳 —— 不能在這裡吃掉計時，
   否則使用者整天開別的分頁就永遠收不到提醒。 */
function tick(){
  if(reminderOpen) return;
  // 目標提醒一天只跳一次，先讓它插隊 — 不然待辦每天都有，目標永遠輪不到
  if(!document.hidden && maybeGoalNudge()) return;
  const list = dueForReminder();
  if(!list.length) return;
  if(document.hidden){
    if(notifOn()){
      notifyDesktop(list);
      const now = Date.now();
      list.forEach(t => { lastRemind[t.id] = now });
      lsSet('todoTestLastRemind_'+me, lastRemind);
    }
    return;
  }
  openReminder(false, list);
}

function notifOn(){
  return ('Notification' in window) && Notification.permission === 'granted' && lsGet('todoTestNotif', true);
}
function notifyDesktop(list){
  try{
    const NL = String.fromCharCode(10);
    const body = list.slice(0,3).map(t => '★'.repeat(Math.max(1,Math.min(5,t.priority||3))) + ' ' + (t.title||'')).join(NL)
               + (list.length > 3 ? NL + '…共 ' + list.length + ' 件' : '');
    const n = new Notification('待辦提醒 · ' + list.length + ' 件', {body, tag:'todo-remind'});
    n.onclick = () => { window.focus(); n.close(); openReminder(true) };
  }catch(e){}
}
function updateNotifBtn(){
  const b = $('notif-b');
  const on = notifOn();
  b.classList.toggle('on', on);
  b.classList.toggle('off', !on);
  b.title = !('Notification' in window) ? '這個瀏覽器不支援桌面通知'
          : Notification.permission === 'denied' ? '瀏覽器已封鎖通知，要到網址列旁邊的鎖頭去開'
          : on ? '桌面通知：開（切到別的分頁也收得到）' : '桌面通知：關 — 點一下開啟';
}
async function toggleNotif(){
  if(!('Notification' in window)){ toast('這個瀏覽器不支援桌面通知'); return }
  if(Notification.permission === 'denied'){ toast('瀏覽器把通知封鎖了，要去網址列旁的鎖頭開'); return }
  if(Notification.permission === 'granted'){
    const on = !lsGet('todoTestNotif', true);
    lsSet('todoTestNotif', on);
    toast(on ? '桌面通知已開啟' : '桌面通知已關閉');
  }else{
    const p = await Notification.requestPermission();
    lsSet('todoTestNotif', p === 'granted');
    toast(p === 'granted' ? '桌面通知已開啟' : '沒有拿到通知權限');
  }
  updateNotifBtn();
}

function openReminder(manual, preList){
  if(reminderOpen) return;
  const list = preList || todos.filter(t=>!t.done && remindsMe(t)).sort(sortNotes);
  if(!list.length){
    if(manual) toast('目前沒有未完成的事項');
    return;
  }
  reminderOpen = true;
  const ov = document.createElement('div');
  ov.className='ov'; ov.id='rm-ov'; ov.style.zIndex='300';
  const overdueN = list.filter(t=>dueInfo(t.due).overdue).length;

  ov.innerHTML = '<div class="md">'
    + '<h3>待辦提醒</h3>'
    + '<div class="sub">'+list.length+' 件要處理'
    +   (overdueN?('，其中 <strong style="color:var(--red)">'+overdueN+' 件已逾期</strong>'):'')
    +   (manual?'':'　·　每 '+settings.everyMin+' 分鐘提醒一次') + '</div>'
    + '<div class="rm-list" id="rm-list">'+ list.map(rmItem).join('') +'</div>'
    + '<div class="md-ft">'
    +   (isAdmin()
        ? '<button class="btn left" id="rm-off">關閉全體提醒</button>'
        : '<span class="left" style="font-size:11px;color:var(--dm)">最少 '+SNOOZE_MIN+' 分、最多 '+SNOOZE_MAX+' 分</span>')
    +   '<select id="rm-snooze" style="width:auto;min-width:118px">'
    +     '<option value="">稍後提醒…</option>'
    +     '<option value="10">10 分鐘後</option><option value="20">20 分鐘後</option>'
    +     '<option value="30">30 分鐘後</option><option value="45">45 分鐘後</option>'
    +     '<option value="60">1 小時後</option>'
    +   '</select>'
    +   '<button class="btn btn-g" id="rm-ok">知道了</button>'
    + '</div></div>';
  document.body.appendChild(ov);

  const close = ()=>{ ov.remove(); reminderOpen=false; render() };
  const ack = ()=>{
    const now = Date.now();
    list.forEach(t=>{ lastRemind[t.id] = now });
    lsSet('todoTestLastRemind_'+me, lastRemind);
  };

  ov.querySelectorAll('.rm-item [data-act="toggle"]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.closest('.rm-item').dataset.id;
      await toggleDone(id);
      b.closest('.rm-item').remove();
      if(!ov.querySelectorAll('.rm-item').length){ ack(); close(); toast('全部處理完了') }
    };
  });
  ov.querySelector('#rm-ok').onclick = ()=>{ ack(); close() };
  ov.querySelector('#rm-snooze').onchange = async e=>{
    await authReady;
    let m = parseInt(e.target.value);
    if(!m) return;
    if(!isAdmin()) m = Math.max(SNOOZE_MIN, Math.min(SNOOZE_MAX, m));   // 一般人夾在 10~60 分
    const until = Date.now() + m*60000;
    try{ await db.ref(PATHS.snooze+'/'+me).set({until, by:me, setAt:firebase.database.ServerValue.TIMESTAMP}) }catch(_){}
    snoozeUntil = until;
    ack(); close();
    toast(m+' 分鐘後再提醒你');
  };
  if(isAdmin()){
    ov.querySelector('#rm-off').onclick = async ()=>{
      await authReady;
      if(!confirm('關閉之後全部的人都不會再收到提醒，確定？')) return;
      try{ await db.ref(PATHS.settings).update({enabled:false, offBy:me, offAt:firebase.database.ServerValue.TIMESTAMP}) }catch(_){}
      logAction('關閉全體提醒','');
      ack(); close(); toast('已關閉全體提醒（設定裡可以開回來）');
    };
  }
}

function rmItem(t){
  const d = dueInfo(t.due);
  let m = '<span class="stars" style="color:'+starColor(t.priority)+'">'+starStr(t.priority)+'</span>';
  m += '<span class="pill">'+esc(t.cat||'')+'</span>';
  if(t.due) m += '<span class="pill due'+(d.overdue?' od':'')+'">'+esc(d.txt)+'</span>';
  if(t.noRemind) m += '<span class="pill mute">不提醒</span>';
  if(t.assignee) m += '<span class="pill asg">指派 '+esc(t.assignee)+(t.assignee===me?'（你）':'')+'</span>';
  return '<div class="rm-item'+(d.overdue?' od':'')+'" data-id="'+esc(t.id)+'">'
    + '<button class="n-chk" data-act="toggle" title="標記完成"></button>'
    + '<div class="rm-b"><div class="rm-t">'+esc(t.title||'')+'</div>'
    +   (t.detail?'<div class="n-detail">'+esc(t.detail)+'</div>':'')
    +   '<div class="rm-m">'+m+'</div>'
    +   '<div class="n-foot">新增：'+esc(t.createdBy||'?')+'</div>'
    + '</div></div>';
}


/* =========================================================================
   進度留言
   杰哥 2026-08-20：「有些代辦可能沒處理好，底下可以留言處理進度或碰到的狀況，
   所以沒勾選消除代辦。」→ 每張便利貼底下掛一串留言，誰都能留，不用先完成。
   留言用 push 存在 todos/{id}/msgs 底下，兩個人同時留不會互相蓋掉。
   留言刻意不會讓提醒停下來 —— 事情沒做完就是沒做完，留言只是讓大家看得到卡在哪。
   ========================================================================= */
let _threadPainters = {};
function tdLayerOrBody(){
  return (typeof tdLayer === 'function') ? tdLayer() : document.body;
}
function noteMsgs(t){
  const M = (t && t.msgs) || {};
  return Object.keys(M).map(k=>Object.assign({id:k}, M[k])).sort((a,b)=>(b.ts||0)-(a.ts||0));
}
function openThread(id){
  const t = todos.find(x=>x.id===id);
  if(!t) return;
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.style.zIndex = '330';
  const paint = ()=>{
    const cur = todos.find(x=>x.id===id) || t;
    const list = noteMsgs(cur);
    const box = ov.querySelector('#th-list');
    if(!box) return;
    box.innerHTML = list.length
      ? list.map(m=>'<div class="th-i"><div class="th-h"><b>'+esc(m.by||'?')+'</b><span>'+esc(fmtTime(m.ts))+'</span></div>'
          + '<div class="th-t">'+esc(m.text||'')+'</div>'
          + ((isAdmin()||m.by===me)?'<button class="th-x" data-mid="'+esc(m.id)+'" title="\u522a\u9019\u5247">\u00d7</button>':'')
          + '</div>').join('')
      : '<div class="g-empty" style="padding:22px">還沒有人留言。卡在哪、做到哪，寫一行讓大家知道。</div>';
    box.querySelectorAll('.th-x').forEach(b=>b.onclick = async ()=>{
      await authReady;
      if(!confirm('刪掉這則留言？')) return;
      try{ await db.ref(PATHS.todos+'/'+id+'/msgs/'+b.dataset.mid).remove() }
      catch(e){ toast('刪不掉：'+e.message) }
    });
  };
  ov.innerHTML = '<div class="md" style="max-width:520px">'
    + '<h3>進度／狀況</h3>'
    + '<div class="sub">'+esc(t.title||'')+'　·　留言不會讓提醒停止，事情做完了還是要記得勾起來</div>'
    + '<div class="th-list" id="th-list"></div>'
    + '<div class="fld" style="margin-top:12px"><label>寫一則進度</label>'
    +   '<textarea id="th-in" maxlength="300" placeholder="例：已經跟客人約好，等他回時間／零件還沒到，等廠商"></textarea></div>'
    + '<div class="md-ft"><span class="left" style="font-size:11px;color:var(--dm)">會記錄是誰、什麼時候留的</span>'
    +   '<button class="btn" id="th-close">關閉</button><button class="btn btn-g" id="th-send">送出</button></div>'
    + '</div>';
  tdLayerOrBody().appendChild(ov);
  paint();
  _threadPainters[id] = paint;
  const close = ()=>{ delete _threadPainters[id]; ov.remove() };
  ov.onclick = e=>{ if(e.target===ov) close() };
  ov.querySelector('#th-close').onclick = close;
  ov.querySelector('#th-send').onclick = async ()=>{
    await authReady;
    const ta = ov.querySelector('#th-in');
    const text = ta.value.trim();
    if(!text){ toast('留言不能空白'); return }
    try{
      await db.ref(PATHS.todos+'/'+id+'/msgs').push({by:me, text:text, ts:firebase.database.ServerValue.TIMESTAMP});
      logAction('留言', (t.title||'')+'：'+text.slice(0,40));
      ta.value = '';
      toast('已留言');
    }catch(e){ toast('留言失敗：'+e.message) }
  };
  setTimeout(()=>{ const el = ov.querySelector('#th-in'); if(el) el.focus() }, 60);
}

    + '<div class="fld"><label>提醒總開關</label><div class="seg" id="s-en">'
    +   '<button data-v="1"'+(settings.enabled?' class="on"':'')+'>開啟提醒</button>'
    +   '<button data-v="0"'+(!settings.enabled?' class="on"':'')+'>全部關掉</button>'
    + '</div></div>'
    + '<div class="fld"><label>多久提醒一次（全域預設）</label><div class="seg" id="s-ev">'

      logAction('改提醒設定', (en?'開啟':'關閉')+' / 每 '+ev+' 分');

/* =========================================================================
   個人目標
   ─ 兩種型態：有終點（target 有數字，例「九月賣出 2 把吉他」）
              無終點（target 空白，純累積戰績，例「銷售大保養」）
   ─ 可見性：本人＋管理員。同事之間互相看不到。
     ⚠ 這是介面層擋的；Firebase 規則目前全公開，直連資料庫仍讀得到。
   ─ 累積數不存欄位，改成把每次加減 push 進 log 再加總。
     兩台同時按加一都會各自 push，不會互相蓋掉（存 count 就會）。
   ========================================================================= */
function goalLog(g){
  const L = g.log || {};
  return Object.keys(L).map(k=>Object.assign({id:k}, L[k])).sort((a,b)=>(b.ts||0)-(a.ts||0));
}
function goalCount(g){
  return goalLog(g).reduce((s,e)=>s + (Number(e.delta)||0), 0);
}
function goalVisible(g){ return g && !g.archived && (g.owner===me || isAdmin()) }
function goalCanBump(g){ return g.owner===me || isAdmin() }
function goalHit(g){ return g.target ? goalCount(g) >= g.target : false }
function goalExpired(g){ return !!(g.end && g.end < todayStr() && !goalHit(g)) }
function goalDaysLeft(g){
  if(!g.end) return null;
  return Math.round((new Date(g.end+'T23:59:59') - Date.now()) / 86400000);
}
function goalPeriodText(g){
  if(!g.start && !g.end) return '不限期間';
  if(g.start && g.end)   return g.start.slice(5) + ' ～ ' + g.end.slice(5);
  return g.end ? ('截止 '+g.end.slice(5)) : ('自 '+g.start.slice(5));
}

function sortGoals(a,b){
  const ae=goalExpired(a), be=goalExpired(b);
  if(ae!==be) return ae?-1:1;                         // 逾期未達標排最前
  const ah=goalHit(a), bh=goalHit(b);
  if(ah!==bh) return ah?1:-1;                         // 已達standard的往後放
  const ad=goalDaysLeft(a), bd=goalDaysLeft(b);
  if(ad!=null && bd!=null && ad!==bd) return ad-bd;   // 剩越少天越前面
  if(ad!=null && bd==null) return -1;
  if(ad==null && bd!=null) return 1;
  return (b.createdAt||0)-(a.createdAt||0);
}

function renderGoals(){
  const mine = goals.filter(goalVisible);

  // 篩選列：管理員多一排人員篩選
  let bar = '';
  if(isAdmin()){
    const owners = Array.from(new Set(mine.map(g=>g.owner))).sort();
    bar += '<button class="chip'+(gWho===''?' on':'')+'" data-w="">全部人<span class="n">'+mine.length+'</span></button>';
    owners.forEach(o=>{
      const n = mine.filter(g=>g.owner===o).length;
      bar += '<button class="chip'+(gWho===o?' on':'')+'" data-w="'+esc(o)+'">'+esc(o)+'<span class="n">'+n+'</span></button>';
    });
    bar += '<span class="bar-sp"></span><span style="font-size:11px;color:var(--dm)">管理員看得到全部人的目標</span>';
  }else{
    bar = '<span style="font-size:11px;color:var(--dm)">這一頁只有你自己和管理員看得到，同事看不到。</span>';
  }
  $('gbar').innerHTML = bar;
  $('gbar').querySelectorAll('.chip[data-w]').forEach(b=>b.onclick=()=>{gWho=b.dataset.w;render()});

  let list = mine;
  if(isAdmin() && gWho) list = list.filter(g=>g.owner===gWho);
  list.sort(sortGoals);

  $('goals').innerHTML = list.length
    ? list.map(goalHTML).join('')
    : '<div class="g-empty" style="grid-column:1/-1">還沒有目標。<br>按右上角「＋ 新增」開一個，例如「九月賣出 2 把吉他」或不設終點的「銷售大保養」累積戰績。</div>';

  bindGoals();
}

function goalHTML(g){
  const cnt = goalCount(g), tgt = g.target || 0;
  const hit = goalHit(g), exp = goalExpired(g);
  const pct = tgt ? Math.min(100, Math.round(cnt/tgt*100)) : 0;
  const left = goalDaysLeft(g);
  const unit = g.unit || '次';
  const log = goalLog(g);
  const last = log.find(e=>(Number(e.delta)||0) > 0);

  let meta = '<span class="pill">'+esc(goalPeriodText(g))+'</span>';
  if(exp)                      meta += '<span class="pill due od">已到期未達標</span>';
  else if(hit)                 meta += '<span class="pill" style="background:var(--grn-bg);color:var(--grn);border-color:var(--grn)">已達標</span>';
  else if(left!=null && left<=7 && left>=0) meta += '<span class="pill due">剩 '+left+' 天</span>';
  if(!g.target)                meta += '<span class="pill mute">純累積</span>';

  return '<div class="g-card '+(hit?'hit':'')+' '+(exp?'expired':'')+'" data-id="'+g.id+'">'
    + '<div class="g-top">'
    +   '<span class="g-owner">'+esc(g.owner||'?')+'</span>'
    +   '<div class="g-title">'+esc(g.title||'')+'</div>'
    +   (goalCanBump(g) || isAdmin() || g.createdBy===me
        ? '<div class="n-act">'
          + '<button class="n-ico" data-act="gedit" title="編輯"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>'
          + '</div>' : '')
    + '</div>'
    + '<div class="g-num"><b>'+cnt+'</b><span>'+(g.target?(' / '+g.target+' '+esc(unit)):(' '+esc(unit)+'（累積中）'))+'</span></div>'
    + (g.target ? '<div class="g-bar"><i style="width:'+pct+'%"></i></div>' : '')
    + '<div class="g-meta">'+meta+'</div>'
    + '<div class="g-ft">'
    +   (goalCanBump(g)
        ? '<button class="g-plus" data-act="gplus">＋1</button><button class="btn btn-sm" data-act="gminus">－1</button>'
        : '<span style="font-size:11px;color:var(--ht)">只有本人和管理員可以計數</span>')
    +   '<span class="g-hist">'+(last ? ('最近一次 '+fmtTime(last.ts)+'<br>由 '+esc(last.by||'?')) : '還沒有紀錄')+'</span>'
    + '</div>'
    + (log.length ? '<div class="g-log">'+log.slice(0,4).map(e=>
        fmtTime(e.ts)+'　'+((Number(e.delta)||0)>0?'+':'')+(Number(e.delta)||0)+'　'+esc(e.by||'?')+(e.note?('　'+esc(e.note)):'')
      ).join('<br>')+(log.length>4?('<br>…共 '+log.length+' 筆'):'')+'</div>' : '')
    + '</div>';
}

function bindGoals(){
  $('goals').querySelectorAll('.g-card').forEach(card=>{
    const id = card.dataset.id;
    const q = a => card.querySelector('[data-act="'+a+'"]');
    if(q('gplus'))  q('gplus').onclick  = ()=>bumpGoal(id, 1);
    if(q('gminus')) q('gminus').onclick = ()=>bumpGoal(id, -1);
    if(q('gedit'))  q('gedit').onclick  = ()=>openGoalEdit(id);
  });
}

async function bumpGoal(id, delta){
  await authReady;
  const g = goals.find(x=>x.id===id);
  if(!g) return;
  if(!goalCanBump(g)){ toast('只有本人和管理員可以計數'); return }
  if(delta < 0 && goalCount(g) <= 0){ toast('已經是 0 了'); return }
  let note = '';
  if(delta > 0){
    const inp = prompt('加一筆「'+(g.title||'')+'」。\n要備註嗎？（可留白直接按確定）', '');
    if(inp === null) return;                 // 按取消就不加
    note = (inp || '').trim().slice(0, 60);
  }
  try{
    await db.ref(PATHS.goals+'/'+id+'/log').push({
      by: me, delta: delta, note: note,
      ts: firebase.database.ServerValue.TIMESTAMP
    });
    logAction(delta>0?'目標+1':'目標-1', (g.owner||'')+' / '+(g.title||''));
    const after = goalCount(g) + delta;
    if(g.target && after >= g.target && delta > 0) toast('達標了！'+g.title+' '+after+'/'+g.target);
    else toast(delta>0 ? ('已記一筆，目前 '+after) : ('已扣一筆，目前 '+after));
  }catch(e){ toast('寫入失敗：'+e.message) }
}

/* 目標提醒：一天最多一次，不跟著待辦每 N 分鐘吵。
   只有「有截止日、還沒達標、且剩 7 天內或已過期」的才會提醒 —
   一個月期的目標天天催沒有意義，快到期才有意義。 */
function goalsNeedingNudge(){
  if(!settings.enabled) return [];
  if(Date.now() < snoozeUntil) return [];
  return goals.filter(g=>{
    if(!goalVisible(g) || g.owner !== me) return false;   // 只催自己的
    if(!g.end || goalHit(g)) return false;
    const left = goalDaysLeft(g);
    return left !== null && left <= 7;                    // 含逾期（left 會是負的）
  }).sort(sortGoals);
}
function maybeGoalNudge(){
  const list = goalsNeedingNudge();
  if(!list.length) return false;
  const key = 'todoTestGoalNudge_'+me;
  const lastDay = lsGet(key, '');
  if(lastDay === todayStr()) return false;                // 今天催過了
  // 先開視窗、開成功才記「今天催過」。順序反過來的話：如果這一刻剛好有別的提醒
  // 視窗開著，openGoalNudge 會直接 return，結果沒跳出來卻已經記成催過了，
  // 這一整天就再也不會提醒目標。
  if(!openGoalNudge(list)) return false;
  lsSet(key, todayStr());
  return true;
}
function openGoalNudge(list){
  if(reminderOpen) return false;      // 回傳成不成功，讓 maybeGoalNudge 決定要不要記「今天催過」
  reminderOpen = true;
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.style.zIndex = '300';
  ov.innerHTML = '<div class="md" style="max-width:440px">'
    + '<h3>個人目標進度</h3>'
    + '<div class="sub">快到期還沒達標，一天只提醒一次</div>'
    + '<div class="rm-list">' + list.map(g=>{
        const left = goalDaysLeft(g), cnt = goalCount(g);
        return '<div class="rm-item" style="display:block">'
          + '<div style="font-weight:700">'+esc(g.title)+'</div>'
          + '<div style="font-size:11.5px;color:var(--dm);margin-top:3px">'
          +   '目前 '+cnt+' / '+(g.target||'—')+' '+esc(g.unit||'次')+'　·　'
          +   (left < 0
              ? '<span style="color:var(--red);font-weight:700">已過期 '+Math.abs(left)+' 天</span>'
              : (left === 0 ? '<span style="color:var(--red);font-weight:700">今天最後一天</span>' : '剩 '+left+' 天'))
          + '</div></div>';
      }).join('') + '</div>'
    + '<div class="md-ft"><span class="left" style="font-size:11px;color:var(--dm)">明天這個時候會再提醒一次</span>'
    +   '<button class="btn" id="gn-open">去看目標</button><button class="btn btn-g" id="gn-ok">知道了</button></div>'
    + '</div>';
  document.body.appendChild(ov);
  const close = ()=>{ ov.remove(); reminderOpen = false; render() };
  ov.onclick = e=>{ if(e.target===ov) close() };
  ov.querySelector('#gn-ok').onclick = close;
  ov.querySelector('#gn-open').onclick = ()=>{ close(); setView('goals') };
  return true;
}

/* =========================================================================
   我的紀錄 — 把「完成的便利貼」和「目標加一」合成個人戰績。
   可見性跟個人目標同一條規矩：本人看自己，管理員看全部人，同事之間看不到。
   ========================================================================= */
let recWho = '';   // 管理員選看誰；空字串＝自己

function monthKey(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function recTarget(){
  return (isAdmin() && recWho) ? recWho : me;
}
/* 這個人的所有紀錄，新的在前。便利貼算「誰打的勾」，目標算「這個目標的擁有者」，
   代登的情況（管理員幫按）仍算在擁有者頭上，但會標出實際按的人。 */
function recRows(who){
  const rows = [];
  todos.forEach(t => {
    if(t.done && t.doneBy === who && t.doneAt)
      rows.push({kind:'note', ts:t.doneAt, title:t.title||'', sub:t.cat||'', by:who});
  });
  goals.forEach(g => {
    if(g.owner !== who) return;
    Object.values(g.log || {}).forEach(l => {
      if(!l || !l.ts || (l.delta||0) <= 0) return;
      rows.push({kind:'goal', ts:l.ts, title:g.title||'', sub:l.note||'', by:l.by||who, unit:g.unit||'次'});
    });
  });
  return rows.sort((a,b) => b.ts - a.ts);
}

function renderRec(){
  const who = recTarget();
  const rows = recRows(who);
  const thisMonth = monthKey(Date.now());
  const mRows = rows.filter(r => monthKey(r.ts) === thisMonth);

  // 篩選列
  let bar;
  if(isAdmin()){
    const people = Array.from(new Set(
      todos.filter(t=>t.done&&t.doneBy).map(t=>t.doneBy)
        .concat(goals.map(g=>g.owner))
    )).filter(Boolean).sort();
    bar = '<button class="chip' + (recWho===''?' on':'') + '" data-r="">我自己</button>'
        + people.filter(p=>p!==me).map(p =>
            '<button class="chip' + (recWho===p?' on':'') + '" data-r="' + esc(p) + '">' + esc(p) + '</button>').join('')
        + '<span class="bar-sp"></span><span style="font-size:11px;color:var(--dm)">管理員可以看每個人的紀錄</span>';
  }else{
    bar = '<span style="font-size:11px;color:var(--dm)">這一頁只有你自己和管理員看得到，同事看不到。</span>';
  }
  $('rbar').innerHTML = bar;
  $('rbar').querySelectorAll('.chip[data-r]').forEach(b => b.onclick = () => { recWho = b.dataset.r; render() });

  // 數字卡
  const noteM = mRows.filter(r=>r.kind==='note').length;
  const goalM = mRows.filter(r=>r.kind==='goal').length;
  const myGoals = goals.filter(g => g.owner === who && !g.archived);
  const hitN = myGoals.filter(goalHit).length;
  const nowM = new Date();
  const mLabel = (nowM.getMonth()+1) + ' 月';
  $('rc-nums').innerHTML =
      card(mLabel + '完成的待辦', noteM, '累計 ' + rows.filter(r=>r.kind==='note').length + ' 件')
    + card(mLabel + '目標加一次數', goalM, '累計 ' + rows.filter(r=>r.kind==='goal').length + ' 次')
    + card('目標達標', hitN + ' / ' + myGoals.length, myGoals.length ? '進行中 ' + (myGoals.length-hitN) + ' 個' : '還沒有目標');

  function card(k, v, sub){
    return '<div class="rc-n"><div class="k">' + esc(k) + '</div><div class="v">' + esc(String(v)) + '</div><div class="s">' + esc(sub) + '</div></div>';
  }

  // 流水帳（最近 40 筆）
  const head = '<div class="rc-h">' + esc(who) + ' 的紀錄'
             + (rows.length > 40 ? '（最近 40 筆，共 ' + rows.length + ' 筆）' : '（共 ' + rows.length + ' 筆）') + '</div>';
  $('rc-list').innerHTML = head + (rows.length
    ? rows.slice(0,40).map(r =>
        '<div class="rc-r">'
        + '<span class="tag ' + (r.kind==='note'?'n':'g') + '">' + (r.kind==='note'?'待辦':'目標') + '</span>'
        + '<span class="x">' + esc(r.title) + (r.sub ? ' <span style="color:var(--ht)">· ' + esc(r.sub) + '</span>' : '') + '</span>'
        + (r.by !== who ? '<span class="by">代登 ' + esc(r.by) + '</span>' : '')
        + '<span class="t">' + fmtTime(r.ts) + '</span>'
        + '</div>').join('')
    : '<div class="g-empty">還沒有紀錄。勾完一張便利貼、或在目標按一次加一，這裡就會長出來。</div>');
}

function setView(v){

  view = v;
  $('vtabs').querySelectorAll('.vtab').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  $('view-notes').classList.toggle('hidden', v!=='notes');
  $('view-goals').classList.toggle('hidden', v!=='goals');
  $('view-rec').classList.toggle('hidden', v!=='rec');
  $('add-b').classList.toggle('hidden', v==='rec');   // 紀錄頁沒有東西可以新增
  $('add-b').textContent = v==='goals' ? '＋ 新目標' : '＋ 新增';
  lsSet('todoTestView', v);
  render();
}

window.addEventListener('resize', ()=>{ if(me) render() });
boot();
</script>
</body>
</html>
